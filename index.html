ние и процесс","Прилагательное обычно не требует 是: 天气很热。 正在 перед глаголом обозначает процесс: 正在学习。"],["Умею, могу, хочу","会 — освоенный навык; 能 — возможность; 可以 — разрешение; 想 и 要 выражают желание или намерение."]],"H2":[["Сравнение","A 比 B + признак: 这件衣服比那件贵。 — Эта одежда дороже той."],["Причина и уступка","因为…所以… — потому что…поэтому…; 虽然…但是… — хотя…но…."],["Опыт и состояние","过 guo после глагола — опыт; 着 zhe — сохраняющееся состояние. Это разные функции, их не заменяют друг другом."],["Результат и степень","看懂 — прочитать и понять; 做完 — закончить делать. 得 вводит оценку действия: 她说得很好。"],["Направление и расстояние","进来/进去、出来/出去 показывают направление относительно говорящего. A 离 B 很近 — A близко к B."],["Скорое событие","快要…了 — вот-вот произойдёт; 已经…了 — уже произошло. 每天 — каждый день, 经常 — часто."]]}};

s in the suitcase?","x":"Place + 有 + item describes what is present in a location."},"一本词典。":{"r":"One dictionary.","x":"本 is a measure word for books, including dictionaries."},"一支笔。":{"r":"One pen.","x":"支 is a measure word for pens and similar thin objects."},"一件衣服。":{"r":"One item of clothing.","x":"件 is a measure word for items of clothing."},"一把雨伞。":{"r":"One umbrella.","x":"把 is used for objects with handles, such as umbrellas."},"好不好？":{"r":"Is that all right?","x":"好不好 is an affirmative-negative question."},"你去不去？":{"r":"Are you going or not?","x":"Repeat the verb with 不 between the positive and negative forms."},"你吃不吃米饭？":{"r":"Will you eat rice?","x":"吃不吃 is an affirmative-negative question."},"你忙不忙？":{"r":"Are you busy?","x":"忙不忙 is an affirmative-negative question using an adjective."},"你想不想回家？":{"r":"Do you want to go home?","x":"想不想 asks whether someone wants to do something."},"我想回家。":{"r":"I want to go home.","x":"想 + action expresses a wish or intention."},"你一个人吗？":{"r":"Are you on your own?","x":"一个人 can mean one person or alone."},"我来买单。":{"r":"I will pay the bill.","x":"买单 means to pay the bill, especially at a restaurant."},"我可以在这里抽烟吗？":{"r":"May I smoke here?","x":"可以 asks about permission; 在这里 gives the place of the action."},"我可以跳舞吗？":{"r":"May I dance?","x":"可以 expresses permission."},"两杯啤酒。":{"r":"Two glasses of beer.","x":"Use 两 before a measure word; 杯 counts cups or glasses of a drink."},"这个需要煮熟吗？":{"r":"Does this need to be cooked through?","x":"需要 expresses a need; 熟 describes the cooked result."},"这辆车很旧。":{"r":"This car is old.","x":"辆 counts vehicles. 很 links the subject to an adjective."},"你想喝咖啡还是水？":{"r":"Would you like coffee or water?","x":"还是 asks someone to choose between alternatives. Do not add 吗."},"那辆自行车是蓝的。":{"r":"That bicycle is blue.","x":"蓝的 describes a blue item; the already known noun can be omitted."},"我今天有点儿忙。":{"r":"I am a little busy today.","x":"有点儿 goes before a description or state, often with an unwanted nuance."},"这张照片是我姐姐的。":{"r":"This photograph belongs to my older sister.","x":"张 counts photographs; 姐姐的 expresses possession."},"我们公司有三十个职员。":{"r":"Our company has thirty employees.","x":"有 expresses possession or existence. 三十 is thirty."},"我只有两个妹妹。":{"r":"I only have two younger sisters.","x":"Use 两 before a measure word. 只有 means to have only."},"你喜欢这张全家照片吗？":{"r":"Do you like this family photograph?","x":"全家 means the whole family; 吗 makes a yes-or-no question."},"姐姐晚上复习生词。":{"r":"My older sister reviews new words in the evening.","x":"Time normally appears before the verb, after the subject or at the beginning."},"咱们一起去公园吧。":{"r":"Let us go to the park together.","x":"咱们 includes the listener; 吧 makes a suggestion softer."},"我在宿舍收发邮件。":{"r":"I receive and send email in the dormitory.","x":"在 + location precedes the action. 收发 means to receive and send."},"你可以预习课文或者做练习。":{"r":"You can prepare the lesson text or do exercises.","x":"或者 lists possibilities in a statement. 预习 means to prepare new material before a lesson."},"她是我的老师。":{"r":"She is my teacher.","x":"是 links a person to a role; 的 marks possession."},"弟弟不喝牛奶。":{"r":"My younger brother does not drink milk.","x":"不 can negate a habit or intention."},"这个苹果多少钱？":{"r":"How much does this apple cost?","x":"多少钱 asks for a price; the question word stays where the answer goes."},"你们明天去学校吗？":{"r":"Are you going to school tomorrow?","x":"The subject is followed by time and action. 吗 makes a yes-or-no question."},"妈妈在医院工作。":{"r":"Mum works in a hospital.","x":"在 + location + action tells us where an action takes place."},"我想买两本书。":{"r":"I want to buy two books.","x":"两 + 本 + 书: number, measure word, noun."},"今天天气很冷。":{"r":"The weather is cold today.","x":"An adjective predicate normally does not need 是; 很 can act as a linking word."},"他正在看电影。":{"r":"He is watching a film right now.","x":"正在 before the verb emphasises an action in progress."},"你女儿今年几岁？":{"r":"How old is your daughter this year?","x":"几岁 usually asks about the age of a child."},"我们都喜欢吃饺子。":{"r":"We all like eating dumplings.","x":"都 refers to the subject and comes before the verb."},"我昨天没有上课。":{"r":"I did not attend class yesterday.","x":"没有 can negate a past action."},"请给我一个杯子。":{"r":"Please give me one cup.","x":"请 makes the request polite. 杯子 means a cup or glass; 个 counts the object here."},"这本书比那本书贵。":{"r":"This book is more expensive than that book.","x":"A 比 B + adjective compares A with B."},"因为下雨所以我不出去。":{"r":"I am not going out because it is raining.","x":"因为 introduces a reason; 所以 introduces its result."},"她虽然很累但是很快乐。":{"r":"Although she is very tired, she is happy.","x":"虽然…但是… links a concession with a contrasting result."},"我已经买好机票了。":{"r":"I have already bought the plane ticket.","x":"已经 means already; 好 after a verb describes a satisfactory completed result."},"弟弟正在教室里画画。":{"r":"My younger brother is drawing in the classroom.","x":"正在 emphasises an ongoing action. Both 画 tokens are needed in this exercise."},"你坐过地铁吗？":{"r":"Have you ever taken the metro?","x":"Unstressed 过 after a verb expresses experience. Distinguish it from the verb 过 guò, to pass."},"学校离车站很近。":{"r":"The school is close to the station.","x":"A 离 B 很近/很远 describes the distance between A and B."},"请帮我拿书包。":{"r":"Please help me take the schoolbag.","x":"帮 + person + action means to help someone do something."},"你想喝红茶还是绿茶？":{"r":"Would you like black tea or green tea?","x":"还是 offers a choice in a question; do not add 吗."},"我们一起去打篮球吧。":{"r":"Let us go and play basketball together.","x":"打篮球 means play basketball; football uses 踢足球 instead."},"门口有一个男孩儿。":{"r":"There is a boy at the entrance.","x":"Place + 有 + person or item describes what is there. 站 in this vocabulary band means a station or stop."},"我的生日快要到了。":{"r":"My birthday is coming soon.","x":"快要…了 describes an event that will happen soon."}},"grammar":{"L14":[["Choosing with 还是","A 还是 B offers alternatives in a question. Do not usually add 吗: 你喝水还是茶？ — Do you drink water or tea?"],["Describing with 有点儿","有点儿 + state/adjective: 今天有点儿冷。 — It is a little cold today. This often suggests an unwanted quality."],["Leaving out a known noun","After a description ending in 的, an already understood noun may be left out: 我要新的。 — I want a new one."]],"L15":[["Possession and existence with 有","Person/place + 有 + item: 我家有两只猫。 — We have two cats at home. The negative form is 没有."],["Numbers and measure words","Use number + measure word + noun: 两张照片 — two photographs; 两个妹妹 — two younger sisters."],["几 and 多少","几 usually expects a small number and is used with a measure word. 多少 asks how many or how much without that restriction."]],"L16":[["Place and time","Time goes before the predicate. 在 + place also comes before the action: 我晚上在宿舍学习。 — I study in the dormitory in the evening."],["Frequency","常/常常 means often, 有时候 sometimes, and 总/总是 always. These words normally come before the verb."],["Together and alternatives","跟 + person + 一起 + action: 跟朋友一起学习。 或者 lists possibilities in a statement; 还是 normally offers a choice in a question."]],"H1":[["Basic word order","Subject + time + place + action: 我明天在家学习。 — I will study at home tomorrow."],["Questions","Add 吗 to a yes-or-no question. 什么、谁、哪儿、几、多少 stay where the answer goes: 你买什么？ — What are you buying?"],["Negatives","不 negates a habit, state or intention. 没有 expresses absence or negates an action that happened."],["Objects and quantities","Number + measure word + noun: 两本书、三个苹果。 的 links the owner and the object: 我的书。"],["States and ongoing actions","An adjective normally does not need 是: 天气很热。 正在 before a verb marks an ongoing action: 正在学习。"],["Ability, permission and wishes","会 refers to a learned skill; 能 to ability or possibility; 可以 to permission. 想 and 要 can express wishes or intentions."]],"H2":[["Comparisons","A 比 B + adjective: 这件衣服比那件贵。 — This item of clothing is more expensive than that one."],["Reason and contrast","因为…所以… — because…therefore…; 虽然…但是… — although…but…."],["Experience and states","过 guo after a verb expresses experience; 着 zhe expresses a continuing state. Their functions are different."],["Results and degree","看懂 means read and understand; 做完 means finish doing. 得 introduces an assessment of an action: 她说得很好。"],["Direction and distance","进来/进去、出来/出去 describe direction relative to the speaker. A 离 B 很近 means A is close to B."],["An upcoming event","快要…了 describes something about to happen; 已经…了 describes something that has already happened. 每天 means every day; 经常 means often."]]},"titles":["Greetings","Getting to know Chinese","See you tomorrow","Where are you going?","Meeting a teacher","Learning Chinese","Food and ordering","Shopping and prices","Exchanging currency","Where do you live?","Students and countries","Where do you study?","Describing things","New or old?","Family and quantities","Study and free time"]};

function englishInfo(){return `<div class=card><h2>About the courses</h2><p>Textbook: lessons 1–16 of 汉语教程, third edition. Sets 14–16 contain key vocabulary, revision, explanations and original exercises. They are not a complete transcription of the printed book. Lesson 16 belongs to part 2 of volume 1.</p><p>HSK 1 and HSK 2 follow the November 2025 exam syllabus: 300 entries at level 1 and 200 additional entries at level 2. Shared spellings are grouped into flashcards; different readings and meanings remain separate. English and Russian glosses and exercises are study aids. This is not an official examination product or a full mock exam.</p><p><a href="https://www.chinesetest.cn/syllabus" target=_blank rel=noopener>Official HSK syllabus</a> · <a href="https://github.com/uranbekanarbaev/hsk-3.0-vocabulary-dataset/blob/main/SOURCES.md" target=_blank rel=noopener>Vocabulary transcription source</a> · <a href="https://www.blcup.com/PInfo/index/8660" target=_blank rel=noopener>Textbook publisher</a></p><p>The original database for lessons 1–13 came from our previous study file, with extra vocabulary from lessons. Its lesson assignments and completeness were not checked page by page. Names and extra words can be included with the filters.</p><p>Progress is shared between courses for the same Chinese spelling. It is stored in this browser and does not sync automatically to another device. Use export and import to move a backup. Writing is free practice; stroke order and handwriting are not graded. Speech depends on a Chinese voice installed on your device.</p></div><div class=card><h2>Learning notes</h2>${[['Questions','吗 makes a yes-or-no question. Question words stay in the position of the answer. Affirmative-negative questions such as 是不是 normally do not need 吗.'],['Word order','Time and 在 + place normally precede the action. 去 + place + action describes going somewhere to do something.'],['Measure words','Use number + measure word + noun. 两 is usual before a measure word; 二 is used in counting and numbers such as 二十.'],['Possession and negatives','的 links an owner and an item. 不 negates a habit or intention; 没有 expresses absence or can negate a past action.'],['Pronunciation','Dictionary tones may differ from connected speech. 不 and 一 can change tone; two third tones affect pronunciation. Neutral-tone syllables have no tone mark.'],['Money and weight','One 元/块 equals ten 角/毛 or one hundred 分. One 斤 is 500 grams; one 公斤 is a kilogram.']].map(([h,t])=>`<p><strong>${h}</strong><br>${t}</p>`).join('')}</div>`}

function elementQuizView(kind,r){const t=elementState[kind];if(!t.quiz){const pool=elementPool(kind);if(!pool.length){r.innerHTML='<div class="card">По выбранным фильтрам нет элементов для теста. Вернись в «Изучать» и измени фильтр.</div>';return;}t.quiz={items:shuffle(pool).slice(0,10),i:0,score:0,wrong:[],answer:null,options:null};}
 const q=t.quiz;if(q.i>=q.items.length){r.innerHTML=`<div class="card"><h2>Результат: ${q.score} / ${q.items.length}</h2><p>${q.wrong.length?'Повтори сложные элементы:':'Все ответы верные.'}</p>${q.wrong.map(e=>`<p><span class="zh">${e.h}</span> · ${esc(e.p)} — ${esc(e.r)}</p>`).join('')}<button class="b main" id="element-restart">Ещё один тест</button>${q.wrong.length?'<button class="b" id="element-errors">Повторить только ошибки</button>':''}</div>`;$('#element-restart').onclick=()=>{t.quiz=null;render();};if($('#element-errors'))$('#element-errors').onclick=()=>{t.quiz={items:shuffle(q.wrong),i:0,score:0,wrong:[],answer:null,options:null};render();};return;}
 const e=q.items[q.i];if(!q.options)q.options=shuffle([e,...shuffle(HANZI_ELEMENTS[kind].filter(o=>o.id!==e.id&&o.r!==e.r)).slice(0,3)]);
 r.innerHTML=`<div class="card element-quiz"><span class="small">Вопрос ${q.i+1} / ${q.items.length}</span><h2>${kind==='strokes'?'Какая это черта?':'Что обозначает ключ?'}</h2><div class="element-art">${elementVisual(kind,e)}</div><div class="element-quiz-options">${q.options.map((o,i)=>`<button class="b ${q.answer!==null?(o.id===e.id?'ok':q.answer===i?'bad':''):''}" data-element-answer="${i}" ${q.answer!==null?'disabled':''}>${esc(o.r)}</button>`).join('')}</div>${q.answer!==null?`<p role="status">${q.options[q.answer].id===e.id?'Верно!':'Правильный ответ:'} ${esc(e.h+' · '+e.p)} — <span>${esc(e.r)}</span></p><button class="b main" id="element-next">${q.i===q.items.length-1?'Результат':'Дальше'}</button>`:''}</div>`;
 r.querySelectorAll('[data-element-answer]').forEach(b=>b.onclick=()=>{if(q.answer!==null)return;q.answer=+b.dataset.elementAnswer;const ok=q.options[q.answer].id===e.id;if(ok)q.score++;else q.wrong.push(e);elementMark(kind,e.id,ok?'know':'dont');render();});if($('#element-next'))$('#element-next').onclick=()=>{q.i++;q.answer=null;q.options=null;render();};
}

ьная с поворотами и крюком": "Vertical turn, curve and hook", "Вниз, затем вправо и снова вниз; в конце короткий крюк влево вверх.": "Move down, then right and down again; finish with a short hook up and left.", "Вертикальная с изгибом и крюком": "Vertical curve and hook", "Вниз, затем плавно поверни вправо и закончи коротким крюком вверх.": "Move down, then curve smoothly right and finish with a short upward hook.", "Слева часто превращается в 亻: 你, 他. Этот компонент связан с человеком, но не даёт готового перевода всего знака.": "On the left it often becomes 亻, as in 你 and 他. It is associated with people, but does not translate the whole character.", "Как ключ читается jī и означает столик. Иероглиф 几 в значении «сколько» читается jǐ — это другое употребление.": "As a radical, jī means a small table. The independent 几 meaning “how many” is pronounced jǐ.", "Как традиционный ключ — hǎn, «утёс». Современное 厂 «завод» читается chǎng.": "The traditional radical is hǎn, “cliff”. The modern word 厂 “factory” is chǎng.", "Не путай 口 «рот» и более крупную внешнюю ограду 囗 (ключ №31).": "Do not confuse 口 “mouth” with the larger outer enclosure 囗, radical 31.", "Окружает другие части: например, в 国. Не путай с самостоятельным 口 «рот».": "It surrounds other parts, as in 国. Compare the independent 口 “mouth”.", "В 士 верхняя горизонталь длиннее нижней; у 土 соотношение обычно обратное.": "In 士 the top horizontal is longer; in 土 the proportions are usually reversed.", "Не путай с 土: у 士 верхняя горизонталь обычно длиннее нижней.": "Compare 土: the upper horizontal in 士 is usually longer than the lower one.", "Обычно располагается сверху: 家, 安. Условное название — «крыша».": "Usually sits on top, as in 家 and 安. Its conventional name is “roof”.", "Традиционное чтение ключа — yǎn. Современное 广 «широкий» читается guǎng.": "The traditional radical name is yǎn. The modern word 广 “broad” is guǎng.", "Слева имеет форму 忄, внизу встречается 心 или ⺗. Часто участвует в знаках чувств и мыслей.": "On the left it becomes 忄; at the bottom it can appear as 心 or ⺗. Often used in characters for feelings and thoughts.", "Слева обычно 扌: 打, 找. Часто участвует в обозначениях ручных действий.": "Usually 扌 on the left, as in 打 and 找. Often associated with manual actions.", "Солнце и день. Сравни с 曰 (№73): различаются пропорциями и назначением.": "Sun or day. Compare 曰, radical 73: their proportions and roles differ.", "Луна или месяц. Похожий компонент 月 в названиях частей тела часто восходит к 肉 (№130).": "Moon or month. The similar 月 component in body-part characters often comes from 肉, radical 130.", "Дерево. В составе иероглифа может указывать на растения и деревянные предметы.": "Tree. It may suggest plants or wooden objects within a character.", "Слева обычно 氵: 河, 海. Это вариант ключа 水, а не три отдельные точки.": "Usually 氵 on the left, as in 河 and 海. This is a form of 水, not three unrelated dots.", "Внизу часто 灬: 热. Четыре точки здесь — вариант ключа огня.": "Often 灬 at the bottom, as in 热. These four dots represent the fire radical.", "В составе часто выглядит как 王: 理, 珠. Это позиционная форма ключа 玉.": "Often shaped like 王 in compounds, as in 理 and 珠. This is a positional form of 玉.", "Слева обычно 礻. Не путай с 衤 «одежда» (№145): у неё есть дополнительная черта.": "Usually 礻 on the left. Compare 衤 “clothing”, radical 145, which has an extra stroke.", "Сверху обычно ⺮: 笔, 笑. Две группы коротких черт представляют бамбук.": "Usually ⺮ on top, as in 笔 and 笑. The two groups of short strokes represent bamboo.", "Слева традиционное 糹; в упрощённой письменности — 纟: 红, 纸.": "The traditional left-hand form is 糹; the simplified form is 纟, as in 红 and 纸.", "В составных знаках часто выглядит как 月: 肚, 腿. Не всякая форма 月 обозначает луну.": "Often resembles 月 in compounds, as in 肚 and 腿. Not every 月-shaped component means moon.", "Сверху обычно 艹: 花, 茶. Традиционная форма ключа — 艸.": "Usually 艹 on top, as in 花 and 茶. The traditional radical form is 艸.", "Слева обычно 衤: 裤, 被. Не путай с похожим 礻 «алтарь» (№113).": "Usually 衤 on the left, as in 裤 and 被. Compare 礻 “altar”, radical 113.", "Традиционная форма 言; слева в упрощённых знаках обычно 讠: 说, 话.": "Traditional 言 usually becomes 讠 on the left in simplified characters, as in 说 and 话.", "Часто окружает знак снизу и слева в форме 辶: 这, 近.": "Often wraps a character from below and the left as 辶, as in 这 and 近.", "В составе справа обычно 阝: 都, 部. Похожая форма слева относится к 阜 (№170).": "Usually 阝 on the right, as in 都 and 部. The similar left-hand form belongs to 阜, radical 170.", "В составе слева обычно 阝: 阳, 院. Похожая форма справа относится к 邑 (№163).": "Usually 阝 on the left, as in 阳 and 院. The similar right-hand form belongs to 邑, radical 163.", "Черты": "Strokes", "Ключи": "Radicals", "Ключи Канси": "Kangxi radicals", "ХАНЬЦЗЫ · 汉字笔画": "HANZI · 汉字笔画", "ХАНЬЦЗЫ · 部首": "HANZI · 部首", "в каталоге": "in catalogue", "освоено": "learned", "к повторению": "to review", "Изучать": "Study", "Писать": "Write", "Тесты": "Quizzes", "Ключи →": "Radicals →", "Черты →": "Strokes →", "Освоено": "Learned", "Изучается": "Learning", "К повторению": "To review", "Новое": "New", "Новые": "New", "Освоенные": "Learned", "← В каталог": "← Catalogue", "🔊 Название": "🔊 Name", "Показать движение": "Show movement", "Другие формы:": "Other forms:", "Встречается в знаках:": "Found in characters:", "Попробовать написать": "Try writing", "Отменить штрих": "Undo stroke", "Скрыть образец": "Hide model", "Поиск по элементам": "Search elements", "Символ, пиньинь, значение или номер": "Symbol, pinyin, meaning or number", "Фильтр по изучению": "Filter by learning status", "Количество черт в традиционном ключе": "Strokes in traditional form", "Любое число черт": "Any stroke count", "Ещё один тест": "Another quiz", "Повторить только ошибки": "Retry mistakes", "Какая это черта?": "Which stroke is this?", "Что обозначает ключ?": "What does this radical mean?", "Правильный ответ:": "Correct answer:", "Верно!": "Correct!", "Все ответы верные.": "All answers are correct.", "Повтори сложные элементы:": "Review these elements:", "Поле для письма пальцем или мышью": "Writing area for touch or mouse", "Начертание · черты и ключи": "Writing · strokes and radicals", "Черты и ключи": "Strokes and radicals", "Черта — одно движение без отрыва руки. Здесь 19 учебных форм; это начальная подборка, а не все возможные черты китайской письменности.": "A stroke is one movement without lifting your hand. These 19 forms are an introductory selection, not a complete classification of Chinese strokes.", "Ключ (部首) — компонент для поиска иероглифа в словаре. Здесь все 214 ключей Канси. Ключи состоят из черт; не каждый компонент иероглифа является его словарным ключом.": "A radical (部首) is a component used to look up a character in a dictionary. All 214 Kangxi radicals are included. Radicals consist of strokes; not every component is a dictionary radical.", "Это традиционное словарное название ключа. Оно помогает запоминать компонент, но само по себе не определяет значение и чтение целого иероглифа.": "This is the traditional dictionary name of the radical. It helps you remember the component, but does not determine the meaning or pronunciation of the whole character.", "Схема движения, не каллиграфический образец. Цветная точка обозначает начало.": "A movement diagram, not a calligraphy model. The coloured dot marks the start.", "Повтори символ на поле. Это свободная пропись: приложение не оценивает точность и порядок черт.": "Copy the symbol in the writing area. This is free practice; accuracy and stroke order are not graded.", "Не удалось прочитать или сохранить прогресс элементов. Проверь хранилище браузера.": "Could not read or save element progress. Check browser storage.", "Ничего не найдено. Измени запрос или фильтр.": "No matches. Change the search or filter.", "По выбранным фильтрам нет элементов для теста. Вернись в «Изучать» и измени фильтр.": "No elements match these quiz filters. Return to Study and change the filter.", "Unicode: 214 ключей Канси": "Unicode: 214 Kangxi radicals", "Unicode: названия черт": "Unicode: stroke names", "Сверка чтений ключей": "Radical pronunciation reference", "В меню: «Черты» — 19 учебных форм с показом движения; «Ключи» — все 214 ключей Канси с пиньинем и русскими значениями. Ключ состоит из черт и служит для поиска в словаре. Не каждый компонент является словарным ключом; его значение не даёт готового перевода целого иероглифа.": "The menu includes Strokes: 19 study forms with movement diagrams; and Radicals: all 214 Kangxi radicals with pinyin and English/Russian meanings. A radical consists of strokes and is used for dictionary lookup. Not every component is a dictionary radical, and its meaning does not translate the whole character.", "Русские пояснения и SVG-схемы составлены для приложения. Число черт указано для традиционной формы ключа. Пиньинь — чтение названия ключа; оно иногда отличается от чтения современного слова. Примеры и дополнительные пояснения даны для распространённых ключей.": "Russian explanations, English study labels and SVG diagrams were prepared for this app. Stroke counts refer to the traditional radical form. Pinyin gives the radical name, which may differ from the modern word. Examples and extra notes are supplied for common radicals.", "Отметки элементов хранятся отдельно от прогресса словаря. Пропись свободная: точность и порядок черт не оцениваются. К повторению относятся элементы с отметками «Путаю» и «Не знаю»; календарного расписания нет. Анимация есть у отдельных черт, не у составных ключей.": "Element marks are stored separately from vocabulary progress. Free writing does not grade accuracy or stroke order. Review includes elements marked Not sure or I do not know it; there is no calendar schedule. Movement animation is available for individual strokes, not compound radicals."});
const previousElementTr=tr;
tr=function(value){if(!enMode())return String(value);const text=String(value),trimmed=text.trim();if(Object.prototype.hasOwnProperty.call(UI_EN,trimmed))return text.replace(trimmed,UI_EN[trimmed]);return previousElementTr(text)
.replace(/^Освоено (\d+) \/ (\d+)$/,'Learned $1 / $2')
.replace(/^(\d+) в каталоге$/,'$1 in catalogue')
.replace(/^(\d+) черт$/,'$1 strokes')
.replace(/^Ключ №(\d+) · (\d+) черт в традиционной форме$/,'Radical $1 · $2 strokes in traditional form')
.replace(/^Найдено: (\d+)\. Выбери символ для прописи\.$/,'Found: $1. Choose a symbol to practise writing.')
.replace(/^Найдено: (\d+)\. Нажми на карточку, чтобы открыть описание\.$/,'Found: $1. Open a card to read its description.')
.replace(/^Моя отметка: (.+)\. «Путаю» и «Не знаю» попадут в повторение\.$/,(_,status)=>'My mark: '+previousElementTr(status)+'. Not sure and I do not know it enter the review list.')
.replace(/^Вопрос (\d+) \/ (\d+)$/,'Question $1 / $2')
.replace(/^Результат: (\d+) \/ (\d+)$/,'Result: $1 / $2')
.replace(/^Правильный ответ: /,'Correct answer: ').replace(/^Верно! /,'Correct! ')
.replace(/（справа）/g,' (right)').replace(/（слева）/g,' (left)');};

const previousInfoView=V.info;V.info=r=>{previousInfoView(r);r.insertAdjacentHTML('beforeend',`<div class=card><h2>Черты и ключи</h2><p>В меню: «Черты» — 19 учебных форм с показом движения; «Ключи» — все 214 ключей Канси с пиньинем и русскими значениями. Ключ состоит из черт и служит для поиска в словаре. Не каждый компонент является словарным ключом; его значение не даёт готового перевода целого иероглифа.</p><p>Русские пояснения и SVG-схемы составлены для приложения. Число черт указано для традиционной формы ключа. Пиньинь — чтение названия ключа; оно иногда отличается от чтения современного слова. Примеры и дополнительные пояснения даны для распространённых ключей.</p><p><a href="https://www.unicode.org/charts/PDF/U2F00.pdf" target=_blank rel=noopener>Unicode: 214 ключей Канси</a> · <a href="https://www.unicode.org/versions/Unicode17.0.0/core-spec/appendix-f/" target=_blank rel=noopener>Unicode: названия черт</a> · <a href="https://www.hsk.guide/radicals" target=_blank rel=noopener>Сверка чтений ключей</a></p><p class=small>Отметки элементов хранятся отдельно от прогресса словаря. Пропись свободная: точность и порядок черт не оцениваются. К повторению относятся элементы с отметками «Путаю» и «Не знаю»; календарного расписания нет. Анимация есть у отдельных черт, не у составных ключей.</p></div>`);};
V.strokes=r=>elementView('strokes',r);V.radicals=r=>elementView('radicals',r);

 'M4 4h6a2 2 0 0 1 2 2v15a4 4 0 0 0-4-2H4z M20 4h-6a2 2 0 0 0-2 2v15a4 4 0 0 1 4-2h4z',
 'M7 3h13v15 M4 7h12v14H4z',

let menuOpen=false;
function setMenu(open,restoreFocus=false){
 menuOpen=open;$('#nav').classList.toggle('is-open',open);$('#menu-backdrop').classList.toggle('is-open',open);
 $('#menu-toggle').setAttribute('aria-expanded',String(open));$('#menu-panel').inert=!open;
 if(open)($('#menu-items [aria-current=page]')||$('#menu-items button')).focus({preventScroll:true});
 else if(restoreFocus)$('#menu-toggle').focus({preventScroll:true});
}
function renderMenu(){$('#menu-heading').textContent='Разделы';$('#menu-toggle').querySelector('span').textContent='Меню';$('#menu-items').querySelectorAll('[data-tb]').forEach(b=>b.querySelector('span').textContent=TABS.find(([k])=>k===b.dataset.tb)[1]);
 $('#menu-current').textContent=TABS.find(([k])=>k===S.tab)[1];
 $('#menu-items').querySelectorAll('[data-tb]').forEach(b=>{
  const active=b.dataset.tb===S.tab;
  if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  b.querySelector('.menu-check').textContent=active?'✓':'';
 });
}
$('#menu-items').innerHTML=TABS.map(([k,n],i)=>`<button type="button" data-tb="${k}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${MENU_ICONS[i]}"/></svg><span>${n}</span><span class="menu-check" aria-hidden="true"></span></button>`).join('');
$('#menu-toggle').onclick=()=>setMenu(!menuOpen);
$('#menu-backdrop').onclick=()=>setMenu(false,true);
$('#menu-items').querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>{
 setMenu(false,true);S.tab=b.dataset.tb;S.open=false;render();scrollTo(0,0);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){e.preventDefault();setMenu(false,true)}});
document.addEventListener('focusin',e=>{if(menuOpen&&!$('#nav').contains(e.target))setMenu(false)});

function render(){document.documentElement.lang=S.lang;$('#nav').setAttribute('aria-label','Разделы приложения');coursePrefs.scopes[S.course]=S.scope;try{localStorage.setItem('cc2-courses',JSON.stringify({course:S.course,scopes:coursePrefs.scopes}));localStorage.setItem('cc2-settings',JSON.stringify({scope:coursePrefs.scopes.book||'all',extra:S.extra,names:S.names,hidePy:S.hidePy,mode:S.mode}))}catch(e){storageOK=false}const groups=activeGroups();$('#progress').textContent=!allowedCourse()?'Доступ закрыт':'Знаю '+groups.filter(g=>P[g.h]?.s==='know').length+' / '+groups.length;$('#storage-warning').textContent=storageOK?'':'Прогресс может не сохраниться: хранилище браузера недоступно или повреждено.';document.querySelector('.app-header strong').textContent=enMode()?'汉语 · Chinese':'汉语 · Китайский';courseBar();renderMenu();
 const elements=['strokes','radicals'].includes(S.tab);$('#course-bar').hidden=elements;if(elementCanvasObserver){elementCanvasObserver.disconnect();elementCanvasObserver=null;}if(elements){$('#course-subtitle').textContent='Начертание · черты и ключи';const items=HANZI_ELEMENTS[S.tab];$('#progress').textContent='Освоено '+items.filter(e=>elementProgress[S.tab+':'+e.id]?.s==='know').length+' / '+items.length;}
 statusBar();if(BOOT?.access.blocked&&!['access','info'].includes(S.tab))lockedView($('#app'));else if(!allowedCourse()&&!['access','info','strokes','radicals'].includes(S.tab))lockedView($('#app'));else if(!allowedLesson(S.scope)&&!['lessons','access','info','strokes','radicals'].includes(S.tab))lockedView($('#app'),true);else V[S.tab]($('#app'));bindF($('#app'));if(S.tab==='info')backupControls();localizeUI()}
render();
if(BOOT&&authData){let checking=false;const check=async()=>{if(checking||document.hidden)return;checking=true;try{const r=await fetch('/api/access',{method:'POST',headers:authHeaders(),body:'{}'});if(r.ok){const data=await r.json();if(data.revision!==BOOT.access.revision)location.reload()}else if(r.status===401){BOOT.sessionExpired=true;BOOT.access={...BOOT.access,book:0,hsk:0,blocked:true};BOOT.user=null;resetTraining();render();$('#storage-warning').textContent=tr('Не удалось обновить доступ. Закройте и снова откройте приложение в Telegram.')}}catch(e){}finally{checking=false}};setInterval(check,60000);document.addEventListener('visibilitychange',check)}
}
startApp().catch(()=>{const en=initialLanguage()==='en';document.documentElement.lang=en?'en':'ru';const root=document.querySelector('#app');root.innerHTML='<div class="card"><p>'+ (en?'Could not load access. Close and reopen the app in Telegram.':'Не удалось загрузить доступ. Закройте и снова откройте приложение в Telegram.')+'</p><button class="b" id="retry-load">'+(en?'Retry':'Повторить')+'</button></div>';document.querySelector('#retry-load').onclick=()=>location.reload()});
