main{max-width:560px;margin:0 auto;padding:12px 14px}

.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input[type=search]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.small{font-size:13px;color:var(--mute)}.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute);margin-left:4px}

h2{font-size:18px;margin:6px 0}.stamp{color:var(--seal);font-weight:700}

.app-header{max-width:720px;margin:auto;padding:18px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}.app-header strong{font-size:21px}

/* A compact bottom menu, with the section list opening above the button. */
#nav{position:fixed;z-index:11;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0))}

.menu-chevron{transition:transform .28s ease}

.menu-check{margin-left:auto;font-size:18px}
#menu-backdrop{position:fixed;inset:0;z-index:10;background:#07152155;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}

гательное обычно не требует 是: 天气很热。 正在 перед глаголом обозначает процесс: 正在学习。"],["Умею, могу, хочу","会 — освоенный навык; 能 — возможность; 可以 — разрешение; 想 и 要 выражают желание или намерение."]],"H2":[["Сравнение","A 比 B + признак: 这件衣服比那件贵。 — Эта одежда дороже той."],["Причина и уступка","因为…所以… — потому что…поэтому…; 虽然…但是… — хотя…но…."],["Опыт и состояние","过 guo после глагола — опыт; 着 zhe — сохраняющееся состояние. Это разные функции, их не заменяют друг другом."],["Результат и степень","看懂 — прочитать и понять; 做完 — закончить делать. 得 вводит оценку действия: 她说得很好。"],["Направление и расстояние","进来/进去、出来/出去 показывают направление относительно говорящего. A 离 B 很近 — A близко к B."],["Скорое событие","快要…了 — вот-вот произойдёт; 已经…了 — уже произошло. 每天 — каждый день, 经常 — часто."]]}};

let menuOpen=false;
function setMenu(open,restoreFocus=false){
 menuOpen=open;$('#nav').classList.toggle('is-open',open);$('#menu-backdrop').classList.toggle('is-open',open);
 $('#menu-toggle').setAttribute('aria-expanded',String(open));$('#menu-panel').inert=!open;
 if(open)$('#menu-items [aria-current=page]').focus({preventScroll:true});
 else if(restoreFocus)$('#menu-toggle').focus({preventScroll:true});
}
function renderMenu(){
 $('#menu-current').textContent=TABS.find(([k])=>k===S.tab)[1];
 $('#menu-items').querySelectorAll('[data-tb]').forEach(b=>{
  const active=b.dataset.tb===S.tab;
  if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  b.querySelector('.menu-check').textContent=active?'✓':'';
 });
}
$('#menu-items').innerHTML=TABS.map(([k,n],i)=>`<button type="button" data-tb="${k}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${MENU_ICONS[i]}"/></svg><span>${n}</span><span class="menu-check" aria-hidden="true"></span></button>`).join('');
$('#menu-toggle').onclick=()=>setMenu(!menuOpen);
$('#menu-backdrop').onclick=()=>setMenu(false,true);
$('#menu-items').querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>{
 setMenu(false,true);S.tab=b.dataset.tb;S.open=false;render();scrollTo(0,0);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){e.preventDefault();setMenu(false,true)}});
