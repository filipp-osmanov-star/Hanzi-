try{const raw=JSON.parse(localStorage.getItem('cc2')||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))for(const [h,v] of Object.entries(raw)){if(G.some(g=>g.h===h)&&v&&['know','mix','dont'].includes(v.s))P[h]={s:v.s,n:Number.isFinite(v.n)?Math.max(0,v.n):0}}}catch(e){storageOK=false}
const save=()=>{try{localStorage.setItem('cc2',JSON.stringify(P))}catch(e){storageOK=false}};
let S={tab:'dict',scope:'all',extra:true,names:false,hidePy:false,mode:0,q:'',card:null,open:false,quiz:null,sent:null,wrong:false};
try{const pref=JSON.parse(localStorage.getItem('cc2-settings')||'{}');for(const k of ['extra','names','hidePy'])if(typeof pref[k]==='boolean')S[k]=pref[k];if(['all','a','b','c','weak','errors',...Array.from({length:13},(_,i)=>'L'+(i+1))].includes(pref.scope))S.scope=pref.scope;if([0,1,2].includes(pref.mode))S.mode=pref.mode}catch(e){}
const normalize=t=>String(t).toLowerCase().normalize('NFD').replace(/u\u0308/g,'v').replace(/[\u0300-\u036f]/g,'').replace(/u:/g,'v').replace(/[^\p{L}\p{N}]/gu,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function nextCard(pl,previous){return pick(pl.length>1?pl.filter(g=>g!==previous):pl)}
const lessonsOf=g=>g.m.map(m=>m.s);
function pool(){return G.filter(g=>{const L=lessonsOf(g);
 if(S.scope==='errors')return P[g.h]&&P[g.h].s!=='know';
 const inL=L.some(s=>s[0]=='L'&&(S.scope.startsWith('L')?s===S.scope:({all:1,a:+s.slice(1)<=4,b:+s.slice(1)>=5&&+s.slice(1)<=8,c:+s.slice(1)>=9,weak:1}[S.scope])));
 const ex=S.extra&&L.includes('extra'),nm=S.names&&L.includes('names');
 if(S.scope=='weak')return(inL||ex)&&((WEAK.has(g.h)&&(!P[g.h]||P[g.h].s!='know'))||(P[g.h]&&P[g.h].s!='know'));
 return inL||ex||nm})}
function pick(arr){if(!arr.length)return null;const w=arr.map(g=>{const s=(P[g.h]||{}).s;let x=s=='dont'?4:s=='mix'?3:s=='know'?.4:2;if(WEAK.has(g.h)||g.m.some(m=>/^L1[123]$/.test(m.s)))x*=1.5;return x});
 let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i]}return arr[0]}
const mark=(g,s)=>{const o=P[g.h]||{};P[g.h]={s,n:(o.n||0)+1};save()};
const lbl=s=>s=='extra'?'доп.':s=='names'?'имя':'урок '+s.slice(1);
function speak(t,slow){if(!('speechSynthesis' in window))return alert('Озвучка недоступна в этом браузере.');
 const v=speechSynthesis.getVoices().find(v=>/zh/i.test(v.lang));if(!v&&speechSynthesis.getVoices().length)return alert('На устройстве нет китайского голоса.');
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';if(v)u.voice=v;u.rate=slow?.5:.9;speechSynthesis.speak(u)}
function filters(){const sc=[['all','Все'],['a','1–4'],['b','5–8'],['c','9–13'],['weak','Слабые'],['errors','Мои ошибки']];
 return `<details class=filters><summary>Слова: ${esc(S.scope.startsWith('L')?'урок '+S.scope.slice(1):sc.find(x=>x[0]===S.scope)?.[1]||'Все')}</summary><div class=filter-options><label>Урок <select id=lesson><option value=''>Выбрать урок</option>${Array.from({length:13},(_,i)=>`<option value=L${i+1} ${S.scope==='L'+(i+1)?'selected':''}>${i+1}</option>`).join('')}</select></label><div>${sc.map(([k,n])=>`<button class=chip aria-pressed=${S.scope==k} data-sc=${k}>${n}</button>`).join('')}
 <button class=chip aria-pressed=${S.extra} data-t=extra>Дополнения</button><button class=chip aria-pressed=${S.names} data-t=names>Имена</button></div></div></details>`}
function bindF(r){const ls=r.querySelector('#lesson');if(ls)ls.onchange=()=>{if(ls.value){S.scope=ls.value;S.card=S.quiz=S.sent=S.w=null;S.open=false;render()}};r.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.sc;S.card=S.quiz=S.sent=S.w=null;S.open=false;render()});
 r.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S[b.dataset.t]=!S[b.dataset.t];S.card=S.quiz=S.sent=S.w=null;S.open=false;render()})}
function statusBtns(){return `<div class=row><button class="b" data-m=know>Знаю</button><button class="b" data-m=mix>Путаю</button><button class="b" data-m=dont>Не знаю</button></div>`}
function meanings(g){return g.m.map(m=>`<div class=tr>${esc(m.r)} <span class=tag>${lbl(m.s)}</span><div class=py style="font-size:16px">${esc(m.p)}</div></div>`).join('')}
const V={
dict(r){const q=normalize(S.q);const L=pool().filter(g=>!q||normalize(g.h).includes(q)||g.m.some(m=>normalize(m.p).includes(q)||normalize(m.r).includes(q)));
 r.innerHTML=`<input type=search id=q placeholder="Иероглиф, пиньинь или перевод" value="${esc(S.q)}">${filters()}<div class=small>Слов: ${L.length}</div>`+
 L.map(g=>{const st=(P[g.h]||{}).s;return `<div class=item><span class=zh>${g.h}</span> ${st?`<span class=tag>${{know:'знаю',mix:'путаю',dont:'не знаю'}[st]}</span>`:''}${g.m.map(m=>`<div>${esc(m.p)} — ${esc(m.r)} <span class=tag>${lbl(m.s)}</span></div>`).join('')}</div>`}).join('')+(!L.length?'<div class=card>Ничего не найдено. Измени запрос или фильтр.</div>':'');
 const i=$('#q');i.oninput=()=>{S.q=i.value;const p=i.selectionStart;render();const n=$('#q');n.focus();try{n.setSelectionRange(p,p)}catch(e){}}},
cards(r){const pl=pool();if(!pl.length){r.innerHTML=filters()+'<div class=card>Нет слов по этому фильтру.</div>';return}
 if(!S.card)S.card=pick(pl);const g=S.card,m=g.m[0],md=S.mode;
 const front=md==0?`<div class="big zh">${g.h}</div>`:md==1?`<div class=mid>${esc(g.m.map(x=>x.r).join(' / '))}</div>`:`<div class=mid>${esc(g.m[0].p)}</div>`;
 const back=md==0?meanings(g):`<div class="big zh">${g.h}</div>`+(md==1?g.m.map(x=>`<div class=py>${esc(x.p)}</div>`).join(''):meanings(g));
 r.innerHTML=filters()+`<div class=row><button class=chip aria-pressed=${md==0} data-md=0>汉字→значение</button><button class=chip aria-pressed=${md==1} data-md=1>Русский→汉字</button><button class=chip aria-pressed=${md==2} data-md=2>Пиньинь→汉字</button></div>
 <label class=small><input type=checkbox id=hp ${S.hidePy?'checked':''}> скрыть пиньинь</label>
 <div class=card>${front}${md==0&&!S.hidePy?`<div class=py>${esc(g.m[0].p)}</div>`:''}${S.open?'<hr style="border:0;border-top:1px solid var(--line)">'+back:''}</div>
 <div class=row><button class="b main" id=sp>🔊</button><button class="b main" id=sl>🐢 Медленно</button></div>`+
 (S.open?statusBtns():'<button class="b main" id=op>Показать ответ</button>');
 bindF(r);r.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{S.mode=+b.dataset.md;S.open=false;render()});
 $('#hp').onchange=e=>{S.hidePy=e.target.checked;render()};$('#sp').onclick=()=>speak(g.h);$('#sl').onclick=()=>speak(g.h,1);
 if($('#op'))$('#op').onclick=()=>{S.open=true;render()};
 r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mark(g,b.dataset.m);S.card=nextCard(pool(),g);S.open=false;render()})},
quiz(r){const pl=pool().filter(g=>g.m.length==1);if(pl.length<3){r.innerHTML=filters()+'<div class=card>Слишком мало слов для викторины.</div>';return}
 if(!S.quiz){const g=pick(pl),t=Math.random()<.5?0:1;const ds=[];const cand=pl.filter(x=>x.h!=g.h&&x.m[0].r!=g.m[0].r&&(t==0||x.h!=g.h));
 while(ds.length<2&&cand.length){const x=cand.splice(Math.random()*cand.length|0,1)[0];if(!ds.some(d=>d.m[0].r==x.m[0].r))ds.push(x)}
 const o=shuffle([g,...ds]);S.quiz={g,t,o,a:null}}
 const q=S.quiz,L='ABC';
 r.innerHTML=filters()+`<div class=card><div class="${q.t==0?'big zh':'mid'}">${q.t==0?q.g.h:esc(q.g.m[0].r)}</div>${q.t==0?`<div class=py>${q.a!=null&&!S.hidePy?esc(q.g.m[0].p):''}</div>`:''}</div>`+
 q.o.map((x,i)=>`<button class="b ${q.a!=null?(x==q.g?'ok':i==q.a?'bad':''):''}" data-a=${i}>${L[i]}. ${q.t==0?esc(x.m[0].r):`<span class="zh" style="font-size:26px">${x.h}</span>`}</button>`).join('')+
 (q.a!=null?`<div class=card>${q.g.h} — ${esc(q.g.m[0].p)} — ${esc(q.g.m[0].r)}</div><button class="b main" id=nx>Дальше</button>`:'');
 bindF(r);r.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(q.a!=null)return;q.a=+b.dataset.a;mark(q.g,q.o[q.a]==q.g?'know':'dont');render()});
 if($('#nx'))$('#nx').onclick=()=>{S.quiz=null;render()}},
sent(r){if(!S.sent){const e=EX[Math.random()*EX.length|0];S.sent={e,t:shuffle(e.t),pick:[],done:false}}
 const s=S.sent,e=s.e,ok=s.pick.map(i=>s.t[i]).join('')==e.t.join('');
 r.innerHTML=`<div class=card><div class=tr>${esc(e.r)}</div></div><div class=slot>${s.pick.map(i=>`<button class=tok data-u=${i}>${esc(s.t[i])}</button>`).join('')}</div>
 <div>${s.t.map((w,i)=>`<button class="tok ${s.pick.includes(i)?'used':''}" ${s.pick.includes(i)||s.done?'disabled':''} data-p=${i}>${esc(w)}</button>`).join('')}</div>`+
 (s.done?`<div class=card><div class="mid zh">${esc(e.h)}</div><div class=py>${esc(e.p)}</div><p class=stamp>${ok?'Верно':'Не совпало с учебным вариантом'}</p>${esc(e.x)}</div><button class="b main" id=nx>Следующая</button>`:
 `<div class=row><button class="b main" id=ck ${s.pick.length!==s.t.length?'disabled':''}>Проверить</button><button class=b id=rs>Сбросить</button></div>`);
 r.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(!s.done&&!s.pick.includes(+b.dataset.p)){s.pick.push(+b.dataset.p);render()}});
 r.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{if(!s.done){s.pick=s.pick.filter(i=>i!=b.dataset.u);render()}});
 if($('#ck'))$('#ck').onclick=()=>{if(s.pick.length===s.t.length){s.done=true;render()}};if($('#rs'))$('#rs').onclick=()=>{s.pick=[];render()};
 if($('#nx'))$('#nx').onclick=()=>{S.sent=null;render()}},
fix(r){const L=G.filter(g=>P[g.h]&&P[g.h].s!='know');
 r.innerHTML=`<h2>Повторение (${L.length})</h2>`+(L.length?L.map(g=>`<div class=item><span class=zh>${g.h}</span> <span class=tag>${{mix:'путаю',dont:'не знаю'}[P[g.h].s]}</span>${g.m.map(m=>`<div>${esc(m.p)} — ${esc(m.r)}</div>`).join('')}</div>`).join('')+'<button class="b main" id=go>Тренировать эти слова</button>':'<div class=card>Пока пусто. Отмечай «Путаю» и «Не знаю» в карточках или ошибайся в викторине.</div>');
 const b=$('#go');if(b)b.onclick=()=>{S.scope='errors';S.tab='cards';S.card=null;render()};
 r.insertAdjacentHTML('beforeend',`<p class=small>Всего отмечено: ${Object.keys(P).length}. Статистика считается только по твоим ответам.</p><button class=b id=rp>Сбросить прогресс</button>`);
 $('#rp').onclick=()=>{if(confirm('Стереть весь прогресс?')){P={};save();render()}}},
write(r){const pl=pool();if(!pl.length){r.innerHTML=filters()+'<div class=card>Нет слов по этому фильтру.</div>';return}if(!S.w)S.w=pick(pl);const g=S.w;
 r.innerHTML=filters()+`<div class=card><div class=mid>${esc(g.m[0].r)} <span class=small>${esc(g.m[0].p)}</span></div></div><canvas id=cv></canvas>
 <div class=row><button class=b id=gd>Показать образец</button><button class=b id=cl>Стереть</button><button class="b main" id=nw>Другое слово</button></div>
 <p class=small>Это свободная пропись: приложение не проверяет написание и порядок черт.</p>`;bindF(r);
 const c=$('#cv'),d=window.devicePixelRatio||1;c.width=c.clientWidth*d;c.height=260*d;const x=c.getContext('2d');x.scale(d,d);x.lineWidth=5;x.lineCap='round';x.strokeStyle=getComputedStyle(document.body).color;
 let on=0;const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{on=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e));x.lineTo(...pt(e).map(v=>v+.1));x.stroke()};c.onpointermove=e=>{if(on){x.lineTo(...pt(e));x.stroke()}};c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>on=0;
 $('#cl').onclick=()=>x.clearRect(0,0,c.clientWidth,260);$('#nw').onclick=()=>{S.w=null;render()};
 $('#gd').onclick=()=>{x.save();x.globalAlpha=.18;x.fillStyle=x.strokeStyle;x.font=Math.min(170,(c.clientWidth-24)/g.h.length)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(g.h,c.clientWidth/2,130);x.restore()}},
info(r){r.innerHTML=`<div class=card><h2>О материале</h2><p>${esc(DATA.info).replace(/\n/g,'<br>')}</p></div><div class=card><h2>Правила</h2>${DATA.rules.map(t=>`<p class=small style="color:var(--ink)">${esc(t)}</p>`).join('')}</div>`}};
const TABS=[['dict','Словарь'],['cards','Карточки'],['quiz','Тест'],['sent','Фразы'],['write','Пропись'],['fix','Ошибки'],['info','Инфо']];

const MENU_ICONS=[
 'M4 4h6a2 2 0 0 1 2 2v15a4 4 0 0 0-4-2H4z M20 4h-6a2 2 0 0 0-2 2v15a4 4 0 0 1 4-2h4z',
 'M7 3h13v15 M4 7h12v14H4z',
 'M9 5h10v16H5V5h2 M9 3h6v4H9z M8 13l2 2 5-5',
 'M4 4h16v12H9l-5 4z M8 8h8 M8 12h5',
 'm4 16 12-12 4 4-12 12-5 1z M14 6l4 4',
 'M4 11a8 8 0 1 1 2 7 M4 5v6h6 M12 8v5l3 2',
 'M12 8h.01 M12 11v6 M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18'
];
let menuOpen=false;
function setMenu(open,restoreFocus=false){
 menuOpen=open;$('#nav').classList.toggle('is-open',open);$('#menu-backdrop').classList.toggle('is-open',open);
 $('#menu-toggle').setAttribute('aria-expanded',String(open));$('#menu-panel').inert=!open;
 if(open)$('#menu-items [aria-current=page]').focus({preventScroll:true});
 else if(restoreFocus)$('#menu-toggle').focus({preventScroll:true});
}
function renderMenu(){
 $('#menu-current').textContent=TABS.find(([k])=>k===S.tab)[1];
 $('#menu-items').querySelectorAll('[data-tb]').forEach(b=>{
  const active=b.dataset.tb===S.tab;
  if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  b.querySelector('.menu-check').textContent=active?'✓':'';
 });
}
$('#menu-items').innerHTML=TABS.map(([k,n],i)=>`<button type="button" data-tb="${k}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${MENU_ICONS[i]}"/></svg><span>${n}</span><span class="menu-check" aria-hidden="true"></span></button>`).join('');
$('#menu-toggle').onclick=()=>setMenu(!menuOpen);
$('#menu-backdrop').onclick=()=>setMenu(false,true);
$('#menu-items').querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>{
 setMenu(false,true);S.tab=b.dataset.tb;S.open=false;render();scrollTo(0,0);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){e.preventDefault();setMenu(false,true)}});
document.addEventListener('focusin',e=>{if(menuOpen&&!$('#nav').contains(e.target))setMenu(false)});

function render(){try{localStorage.setItem('cc2-settings',JSON.stringify({scope:S.scope,extra:S.extra,names:S.names,hidePy:S.hidePy,mode:S.mode}))}catch(e){storageOK=false}$('#progress').textContent='Знаю '+Object.values(P).filter(v=>v.s==='know').length+' / '+G.length;$('#storage-warning').textContent=storageOK?'':'Прогресс может не сохраниться: хранилище браузера недоступно или повреждено.';renderMenu();
 V[S.tab]($('#app'));bindF($('#app'))}
render();
</script></body></html>
